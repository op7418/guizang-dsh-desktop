<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilot Harness</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #18181b; background: #f6f6f7; }
      main { width: min(460px, calc(100vw - 48px)); text-align: center; }
      .mark { width: 56px; height: 56px; margin: 0 auto 22px; display: block; object-fit: contain; filter: drop-shadow(0 14px 22px rgb(37 54 190 / 22%)); }
      h1 { margin: 0; font-size: 19px; letter-spacing: -0.025em; }
      p { margin: 10px 0 0; color: #71717a; font-size: 13px; line-height: 1.6; }
      .spinner { width: 18px; height: 18px; margin: 24px auto 0; border: 2px solid rgb(79 70 229 / 18%); border-top-color: #4f46e5; border-radius: 50%; animation: spin .8s linear infinite; }
      .actions { display: none; justify-content: center; gap: 10px; margin-top: 24px; }
      button { height: 36px; padding: 0 14px; border: 1px solid rgb(24 24 27 / 12%); border-radius: 10px; color: inherit; background: white; cursor: pointer; font: inherit; font-size: 13px; }
      button.primary { color: white; border-color: #4f46e5; background: #4f46e5; }
      body.failed .spinner { display: none; }
      body.failed .actions { display: flex; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        body { color: #fafafa; background: #171717; }
        p { color: #a1a1aa; }
        button { border-color: rgb(255 255 255 / 12%); background: #252527; }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="./brand-icon.png" alt="">
      <h1 id="title">Starting Pilot Harness</h1>
      <p id="message">Preparing the local DeepSeek Harness runtime…</p>
      <div class="spinner" aria-label="Loading"></div>
      <div class="actions">
        <button id="data-folder">Open data folder</button>
        <button id="copy-diagnostics">Copy diagnostics</button>
        <button class="primary" id="restart">Try again</button>
      </div>
    </main>
    <script src="./shell.js"></script>
  </body>
</html>
