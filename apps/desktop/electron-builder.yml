appId: com.codepilot.pilotharness
productName: Pilot Harness
executableName: pilot-harness
afterSign: scripts/after-sign.cjs
# DSH materializes profile plugin links back to package directories. Those
# links must target real filesystem paths; an asar archive is not traversable
# through an operating-system symlink.
asar: false
npmRebuild: false
directories:
  output: release
files:
  - dist/**/*
  - package.json
mac:
  category: public.app-category.developer-tools
  # Keep DSH unpacked, but let Apple's native signer traverse the bundle. The
  # default JavaScript signer exhausts file descriptors on this dependency
  # closure before it reaches the application bundle.
  sign: ./scripts/native-macos-sign.cjs
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.inherit.plist
  notarize: false
  icon: assets/icon.icns
  artifactName: "${productName}-${version}-${arch}.${ext}"
  target:
    - dmg
    - zip
win:
  icon: assets/icon.ico
  artifactName: "${productName}.Setup.${version}.${ext}"
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
linux:
  category: Development
  syncDesktopName: true
  icon: assets/icons
  artifactName: "${productName}-${version}-${arch}.${ext}"
  desktop:
    entry:
      Name: Pilot Harness
      Comment: Desktop client for DeepSeek Harness
      Categories: Development;IDE;
      StartupWMClass: pilot-harness
  target:
    - AppImage
    - deb
    - rpm
deb:
  packageName: pilot-harness
rpm:
  packageName: pilot-harness
