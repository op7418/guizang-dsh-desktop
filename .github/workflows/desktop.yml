name: Desktop

# Official desktop packages are produced only on GitHub-hosted native runners.
# Every verified main-branch commit, plus a manual dispatch without a release
# tag, creates short-lived Actions artifacts entirely on GitHub-hosted runners.
# A version-matched v* tag, or the guarded upstream-sync workflow passing an
# explicit release_tag, creates a GitHub Release from native hosted runners.

on:
  pull_request:
    paths:
      - 'README.md'
      - 'README.zh.md'
      - 'apps/desktop/**'
      - 'packages/client/**'
      - 'packages/workspace/ui-worktree/**'
      - 'packages/schedule/ui-schedule-summary/**'
      - 'packages/session-query/session-log-export/**'
      - 'packages/host/apiproxy/**'
      - 'packages/bundle/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional v* tag to publish after all native jobs pass'
        required: false
        type: string
      release_prerelease:
        description: 'Publish the requested release as a prerelease instead of latest'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # A branch push followed by a release tag on the same commit should share
  # one build instead of spending three runners on identical work twice.
  group: desktop-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  native-package:
    name: ${{ matrix.os }} / package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DSH_TELEMETRY_DISABLED: '1'
      # GitHub's macOS runner exposes a 1024x677 Electron content area. Keep
      # one identical viewport on all three platforms so geometry assertions
      # compare the application rather than each host's desktop work area.
      PILOT_HARNESS_E2E_WIDTH: '1024'
      PILOT_HARNESS_E2E_HEIGHT: '677'
      PILOT_HARNESS_E2E_SETTINGS_HEIGHT: '677'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches desktop version
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
        shell: bash
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          actual="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::desktop package version $actual does not match tag $RELEASE_TAG"
            exit 1
          fi

      - name: Build Harness and desktop shell
        run: pnpm run desktop:build

      - name: Run desktop unit checks
        run: pnpm run desktop:test

      - name: Typecheck desktop shell
        run: pnpm --filter @deepseek-ai/dsh-desktop run typecheck

      - name: Run Linux Electron smoke flow
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm --filter @deepseek-ai/dsh-desktop run test:e2e

      - name: Run native Electron smoke flow
        if: runner.os != 'Linux'
        run: pnpm --filter @deepseek-ai/dsh-desktop run test:e2e

      - name: Build native desktop preview artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.release_tag == '')) && runner.os != 'macOS' }}
        run: pnpm --filter @deepseek-ai/dsh-desktop run pack

      - name: Build native macOS desktop preview artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.release_tag == '')) && runner.os == 'macOS' }}
        shell: bash
        timeout-minutes: 45
        run: pnpm --filter @deepseek-ai/dsh-desktop run pack

      - name: Build signed macOS release artifacts
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && runner.os == 'macOS' }}
        shell: bash
        timeout-minutes: 45
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          PILOT_HARNESS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PILOT_HARNESS_REQUIRE_DEVELOPER_ID: '1'
        run: pnpm --filter @deepseek-ai/dsh-desktop run pack:release

      - name: Build release artifacts
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && runner.os != 'macOS' }}
        run: pnpm --filter @deepseek-ai/dsh-desktop run pack:release

      - name: Verify macOS artifact signature
        if: ${{ runner.os == 'macOS' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
        env:
          PILOT_HARNESS_ALLOW_ADHOC_SIGNING: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') && '0' || '1' }}
          PILOT_HARNESS_APPLE_TEAM_ID: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') && secrets.APPLE_TEAM_ID || '' }}
          PILOT_HARNESS_REQUIRE_DEVELOPER_ID: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') && '1' || '0' }}
        run: node apps/desktop/scripts/verify-macos-signature.mjs apps/desktop/release 1

      - name: Run packaged desktop smoke on Linux
        if: ${{ runner.os == 'Linux' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
        # GitHub-hosted runners cannot chown the packaged Chromium SUID helper
        # to root:4755. Disable Chromium's sandbox only for this isolated smoke;
        # the shipped application still launches with its default sandbox.
        run: xvfb-run --auto-servernum pnpm --filter @deepseek-ai/dsh-desktop run test:packaged -- --no-sandbox

      - name: Run packaged desktop smoke
        if: ${{ runner.os != 'Linux' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
        run: pnpm --filter @deepseek-ai/dsh-desktop run test:packaged

      - uses: actions/upload-artifact@v4
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: pilot-harness-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          if-no-files-found: error
          retention-days: 7

  plugin-bundles:
    name: Plugin bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin packages
        run: pnpm run build:lib

      - name: Pack installable dsh.bundle archives
        shell: bash
        run: |
          mkdir -p release/plugins
          pnpm --filter @deepseek-ai/dsh-client-ui-codepilot-theme pack --pack-destination release/plugins
          pnpm --filter @deepseek-ai/dsh-ui-worktree pack --pack-destination release/plugins
          pnpm --filter @deepseek-ai/dsh-ui-schedule-summary pack --pack-destination release/plugins
          pnpm --filter @deepseek-ai/dsh-session-log-export pack --pack-destination release/plugins

      - name: Verify bundle installation and profile composition
        shell: bash
        run: |
          export DSH_HOME="$RUNNER_TEMP/pilot-plugin-profile"
          pnpm dsh plugin --profile web add "$GITHUB_WORKSPACE"/release/plugins/*.tgz
          pnpm dsh --profile web --dump-config > "$RUNNER_TEMP/pilot-plugin-config.yml"
          grep -q 'id: codepilot-theme' "$RUNNER_TEMP/pilot-plugin-config.yml"
          grep -q 'id: pilot-worktree' "$RUNNER_TEMP/pilot-plugin-config.yml"
          grep -q 'id: pilot-schedule-summary' "$RUNNER_TEMP/pilot-plugin-config.yml"
          grep -q 'id: session-log-download' "$RUNNER_TEMP/pilot-plugin-config.yml"

      - uses: actions/upload-artifact@v4
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: pilot-harness-plugins
          path: release/plugins/*.tgz
          if-no-files-found: error
          retention-days: 7

  release-quality:
    name: Release quality gates
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    env:
      DSH_TELEMETRY_DISABLED: '1'
      # Match the source-release baseline: release verification is exhaustive,
      # but serialized so coverage, snapshots, docs, and browser E2E do not
      # contend on the standard hosted runner.
      DSH_GATE_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser test runtime
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      - name: Prepare Linux sandbox
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Run complete source and artifact gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.repository.default_branch == github.ref_name && github.event.before || github.sha }}
        run: |
          pnpm run check:ci:linux-primary
          node apps/desktop/scripts/audit-codepilot-ui.mjs

  publish-release:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    needs: [native-package, plugin-bundles, release-quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v5
        with:
          pattern: pilot-harness-*
          path: release-assets
          merge-multiple: true

      - name: Give desktop installers stable download names
        shell: bash
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: node .github/scripts/prepare-release-assets.mjs release-assets "$RELEASE_TAG"

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #'
          ) > release-assets/SHA256SUMS.txt
          cat release-assets/SHA256SUMS.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_prerelease) || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.')) }}
          make_latest: ${{ !((github.event_name == 'workflow_dispatch' && inputs.release_prerelease) || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.'))) }}
          fail_on_unmatched_files: true
          files: |
            release-assets/Pilot-Harness-*.dmg
            release-assets/Pilot-Harness-*.zip
            release-assets/Pilot-Harness-*.exe
            release-assets/Pilot-Harness-*.AppImage
            release-assets/Pilot-Harness-*.deb
            release-assets/Pilot-Harness-*.rpm
            release-assets/deepseek-ai-*.tgz
            release-assets/SHA256SUMS.txt
